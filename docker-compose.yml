# Runs only the web app. Start the API separately (slotwise-backend), then:
#   docker compose up --build        → http://localhost:3000
# NEXT_PUBLIC_API_URL is baked into the browser bundle at build time.

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_BUSINESS_SLUG: ${NEXT_PUBLIC_BUSINESS_SLUG:-lumen-clinic}
    ports:
      - '3000:3000'
